<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises</title>
    <!-- Importamos Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* IMPORTANTE: El cuerpo y el HTML deben tener altura para que el mapa se vea */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #mapa {
            height: 100vh; /* Altura completa de la pantalla */
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="mapa"></div>

    <!-- Importamos Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializamos el mapa después de que la página cargue
        var map = L.map('mapa').setView([-38.0055, -57.5426], 13);

        // Agregamos la capa de mapa clara
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        console.log("Mapa cargado correctamente");
    </script>
</body>
</html>
