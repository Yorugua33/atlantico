<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Panel de Control</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #333;
        }
        #status-conexion {
            font-weight: bold;
            color: #007bff;
        }
        /* Contenedor del mapa con tamaño fijo y visible */
        #mapa-panel {
            width: 100%;
            height: 550px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>Panel Central - Atlántico Remises</h2>
    <p>Estado: <span id="status-conexion">Esperando señal del chofer...</span></p>

    <!-- Div donde se dibuja el mapa -->
    <div id="mapa-panel"></div>

    <!-- Scripts de Leaflet y Socket.io -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        const socket = io();

        // Inicializar el mapa centrado en Ostende
        const map = L.map('mapa-panel').setView([-37.1290, -56.9052], 15);

        // Cargar las teselas de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markerChofer = null;

        // Escuchar la ubicación en vivo que manda el celular
        socket.on('update-location', (data) => {
            const { lat, lng } = data;
            document.getElementById('status-conexioninnerText', '');
            document.getElementById('status-conexion').innerHTML = `Chofer en vivo -> Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;

            if (!markerChofer) {
                markerChofer = L.marker([lat, lng]).addTo(map).bindPopup("¡Aquí está el chofer!").openPopup();
            } else {
                markerChofer.setLatLng([lat, lng]);
            }
            map.setView([lat, lng], 16);
        });
    </script>
</body>
</html>
