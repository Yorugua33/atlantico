<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Chofer con Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        #mapa-chofer {
            width: 100%;
            height: 75vh;
        }
        .panel-control {
            height: 25vh;
            background: #2c2c2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 90%;
            max-width: 350px;
        }
        #estado {
            font-size: 14px;
            margin-bottom: 8px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <!-- Mapa visible en la pantalla del celular -->
    <div id="mapa-chofer"></div>

    <div class="panel-control">
        <p id="estado">Obteniendo GPS...</p>
        <button class="btn" onclick="actualizarYTransmitir()">Actualizar Mi Posición</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa en el celular
        const map = L.map('mapa-chofer').setView([-37.1290, -56.9052], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let marker = null;

        function actualizarYTransmitir() {
            if ("geolocation" in navigator) {
                document.getElementById('estado').innerText = "Buscando ubicación exacta...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Guardar en localStorage para que la PC lo lea
                        localStorage.setItem('chofer_lat', lat);
                        localStorage.setItem('chofer_lng', lng);
                        localStorage.setItem('chofer_tiempo', Date.now());

                        // Mostrar en el mapa del celular
                        if (!marker) {
                            marker = L.marker([lat, lng]).addTo(map).bindPopup("Estás aquí").openPopup();
                        } else {
                            marker.setLatLng([lat, lng]);
                        }
                        map.setView([lat, lng], 17);

                        document.getElementById('estado').innerText = `¡Transmitido! Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;
                    },
                    (error) => {
                        document.getElementById('estado').innerText = "Error: Activa el GPS en el celu.";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById('estado').innerText = "Tu navegador no soporta GPS.";
            }
        }

        // Ejecutar al abrir la página
        setTimeout(actualizarYTransmitir, 1000);
    </script>
</body>
</html>
