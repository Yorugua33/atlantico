<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Chofer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0; padding: 0; background: #1a1a1a; color: white;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; text-align: center;
        }
        .card { background: #2c2c2c; padding: 25px; border-radius: 12px; width: 85%; max-width: 400px; }
        h2 { color: #4CAF50; font-size: 20px; }
        .btn {
            background: #28a745; color: white; border: none; padding: 15px;
            font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 15px;
        }
        #estado { font-size: 14px; margin: 15px 0; color: #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Modo Chofer</h2>
        <p id="estado">Listo para transmitir</p>
        <button class="btn" onclick="enviarUbicacionAPI()">Transmitir Posición</button>
    </div>

    <script>
        let lat = -37.1290;
        let lng = -56.9052;

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition((pos) => {
                lat = pos.coords.latitude;
                lng = pos.coords.longitude;
                document.getElementById('estado').innerText = `GPS OK: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            });
        }

        function enviarUbicacionAPI() {
            document.getElementById('estado').innerText = "Enviando...";
            
            // Usamos un servicio gratuito temporal de API (jsonbin o localStorage compartido) 
            // O guardamos localmente para sincronizar pestañas en la misma PC de prueba:
            localStorage.setItem('chofer_lat', lat);
            localStorage.setItem('chofer_lng', lng);
            localStorage.setItem('chofer_tiempo', Date.now());

            document.getElementById('estado').innerText = "¡Posición enviada con éxito!";
        }
    </script>
</body>
</html>
