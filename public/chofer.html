<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Chofer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #2c2c2c;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 400px;
        }
        h2 { margin-top: 0; color: #4CAF50; }
        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn:active { background: #218838; }
        #estado { font-size: 16px; margin: 15px 0; color: #ddd; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Modo Chofer (Ostende)</h2>
        <p id="estado">Sistema en línea</p>
        <button class="btn" onclick="enviarUbicacion()">Avanzar / Enviar Posición</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Coordenadas iniciales de Ostende
        let lat = -37.1167; 
        let lng = -56.8667;

        // Intentar GPS automático de fondo
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    lat = position.coords.latitude;
                    lng = position.coords.longitude;
                    document.getElementById('estado').innerText = "GPS Activo: " + lat.toFixed(4) + ", " + lng.toFixed(4);
                    socket.emit('update-location', { lat, lng });
                },
                (error) => {
                    console.log("GPS no disponible, usando modo manual");
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        // Botón manual infalible para simular movimiento y reportar al panel
        function enviarUbicacion() {
            lat += 0.001; 
            lng += 0.001;
            document.getElementById('estado').innerText = "Enviando avance...";
            socket.emit('update-location', { lat, lng });
            setTimeout(() => {
                document.getElementById('estado').innerText = "¡Posición enviada al panel!";
            }, 300);
        }
    </script>
</body>
</html>
