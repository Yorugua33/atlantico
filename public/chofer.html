<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Chofer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #2c2c2c;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 400px;
        }
        h2 { margin-top: 0; color: #4CAF50; font-size: 20px; }
        .btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
        }
        #estado { font-size: 14px; margin: 15px 0; color: #ddd; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Modo Chofer</h2>
        <p id="estado">Solicitando permiso de GPS...</p>
        <button class="btn" onclick="pedirGPSReal()">Forzar GPS Real</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function pedirGPSReal() {
            if ("geolocation" in navigator) {
                document.getElementById('estado').innerText = "Buscando satélites GPS...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lng = position.coords.longitude;
                        document.getElementById('estado').innerText = "¡GPS OK! Lat: " + lat.toFixed(4) + " Lng: " + lng.toFixed(4);
                        socket.emit('update-location', { lat, lng });
                    },
                    (error) => {
                        document.getElementById('estado').innerText = "Error GPS: Activa la ubicación en el celu.";
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                document.getElementById('estado').innerText = "Tu navegador no soporta GPS.";
            }
        }

        // Intentar al cargar
        pedirGPSReal();
    </script>
</body>
</html>
