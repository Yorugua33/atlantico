<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Chofer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body style="margin: 0; padding: 0; background: #e0e0e0;">

    <!-- Caja de control flotante -->
    <div style="position: fixed; top: 15px; left: 15px; background: white; padding: 15px; font-family: Arial, sans-serif; z-index: 99999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-radius: 8px;">
        <h3 style="margin: 0 0 8px 0; font-size: 16px;">Modo Chofer (Ostende)</h3>
        <p id="estado" style="margin: 0 0 10px 0; font-size: 14px; color: #555;">Iniciando mapa...</p>
        <button onclick="simularMovimiento()" style="background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">Simular Avance</button>
    </div>
    
    <!-- Mapa ocupando obligatoriamente toda la pantalla -->
    <div id="mapa" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Coordenadas fijas de Ostende
        let lat = -37.1167; 
        let lng = -56.8667;

        // Inicializar mapa
        const map = L.map('mapa').setView([lat, lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const marker = L.marker([lat, lng]).addTo(map);
        document.getElementById('estado').innerText = "Mapa listo en Ostende";

        // Forzar a que el mapa cargue los gráficos visuales correctamente
        setTimeout(() => {
            map.invalidateSize();
        }, 300);

        // GPS en segundo plano
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    lat = position.coords.latitude;
                    lng = position.coords.longitude;
                    marker.setLatLng([lat, lng]);
                    map.setView([lat, lng]);
                    document.getElementById('estado').innerText = "GPS Real Activo";
                    socket.emit('update-location', { lat, lng });
                },
                (error) => {
                    console.log("GPS no disponible");
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        // Botón de simulación
        function simularMovimiento() {
            lat += 0.001;
            marker.setLatLng([lat, lng]);
            map.setView([lat, lng]);
            socket.emit('update-location', { lat, lng });
            document.getElementById('estado').innerText = "Avanzando...";
        }
    </script>
</body>
</html>
