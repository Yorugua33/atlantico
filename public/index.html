<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Atlántico Remises</h1></header>
    <div id="map"></div>
    <div style="text-align: center; margin-top: 20px;">
        <button class="btn-pedir">SOLICITAR REMIS AHORA</button>
    </div>
    <footer>Marcelo Muraña</footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa en una ubicación (Ej: Mar del Plata)
        var map = L.map('map').setView([-38.00, -57.55], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        
        // Icono de auto
        var carIcon = L.divIcon({ html: '🚗', className: 'car-icon', iconSize: [30, 30] });
        var marker = L.marker([-38.00, -57.55], {icon: carIcon}).addTo(map);
    </script>
</body>
</html>
