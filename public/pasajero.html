<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlántico Remises - Pasajero</title>
    <!-- Mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #0a192f; color: white; }
        #map { height: 80vh; width: 100%; }
        .info { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="info">
        <h1>Atlántico Remises</h1>
        <p>Tu móvil está en camino...</p>
    </div>
    <div id="map"></div>

    <!-- Librerías necesarias -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inicializar el mapa
        const map = L.map('map').setView([-38.00, -57.55], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. Crear el marcador del auto
        const carIcon = L.divIcon({ html: '🚗', className: 'car-icon', iconSize: [30, 30] });
        let marker = L.marker([-38.00, -57.55], {icon: carIcon}).addTo(map);

        // 3. Conectar con el servidor
        const socket = io();

        // 4. Escuchar cuando el servidor envía la posición nueva
        socket.on('move-car', (data) => {
            marker.setLatLng([data.lat, data.lng]);
            map.panTo([data.lat, data.lng]); // El mapa sigue al auto
        });
    </script>
</body>
</html>
