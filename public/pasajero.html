<!DOCTYPE html>
<html>
<head>
    <title>Atlántico Remises - Pasajero</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <style>
        #mapa { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <h1>Atlántico Remises</h1>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializa el mapa centrado en Mar del Plata
        var map = L.map('mapa').setView([-38.0055, -57.5426], 13);

        // CAPA CLARA ESTÁNDAR
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Aquí iría tu lógica de socket.io para recibir la ubicación del chofer...
    </script>
</body>
</html>
